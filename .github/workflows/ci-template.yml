name: Reusable CI Workflow

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
        description: 'Service name (e.g., auth, product, user)'
      service_path:
        required: true
        type: string
        description: 'Path to service directory (e.g., auth, product)'
      go_version:
        required: false
        type: string
        default: '1.23'
        description: 'Go version to use'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go_version }}
          cache: true
          cache-dependency-path: ${{ inputs.service_path }}/go.sum

      - name: Download dependencies
        working-directory: ${{ inputs.service_path }}
        run: go mod download

      - name: Run tests
        working-directory: ${{ inputs.service_path }}
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Generate coverage report
        working-directory: ${{ inputs.service_path }}
        run: go tool cover -html=coverage.out -o coverage.html

      - name: Upload coverage to artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.service_name }}-coverage-report
          path: ${{ inputs.service_path }}/coverage.html
          retention-days: 7

      - name: Show coverage summary
        working-directory: ${{ inputs.service_path }}
        run: go tool cover -func=coverage.out | grep total

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go_version }}
          cache: true
          cache-dependency-path: ${{ inputs.service_path }}/go.sum

      - name: Run go vet
        working-directory: ${{ inputs.service_path }}
        run: go vet ./...

      - name: Check go fmt
        working-directory: ${{ inputs.service_path }}
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go code is not formatted properly. Please run 'go fmt ./...'"
            gofmt -d .
            exit 1
          fi

      - name: Run go mod tidy check
        working-directory: ${{ inputs.service_path }}
        run: |
          go mod tidy
          if [ -n "$(git diff go.mod go.sum)" ]; then
            echo "go.mod or go.sum is not tidy. Please run 'go mod tidy'"
            exit 1
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go_version }}
          cache: true
          cache-dependency-path: ${{ inputs.service_path }}/go.sum

      - name: Download dependencies
        working-directory: ${{ inputs.service_path }}
        run: go mod download

      - name: Build application
        working-directory: ${{ inputs.service_path }}
        run: go build -v -o ${{ inputs.service_name }} ./cmd/main.go

      - name: Verify binary exists
        working-directory: ${{ inputs.service_path }}
        run: |
          if [ ! -f ${{ inputs.service_name }} ]; then
            echo "Binary was not created successfully"
            exit 1
          fi
          ls -lh ${{ inputs.service_name }}

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Gosec Security Scanner
        uses: securego/gosec@v2.28.0
        with:
          args: '-no-fail -fmt sarif -out gosec-results.sarif ./${{ inputs.service_path }}/...'

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: gosec-results.sarif
