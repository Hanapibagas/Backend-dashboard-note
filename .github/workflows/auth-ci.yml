name: CI - Auth Service

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read
  security-events: write

jobs:
  call-ci-workflow:
    uses: ./.github/workflows/ci-template.yml
    with:
      service_name: auth
      service_path: auth
      go_version: '1.23'
