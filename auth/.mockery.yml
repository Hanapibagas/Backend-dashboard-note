with-expecter: true
disable-version-string: true
all: true
resolve-type-alias: false
issue-845-fix: true
dir: "{{.InterfaceDir}}/mocks"
mockname: "{{.InterfaceName}}Mock"
outpkg: "mocks"
packages:
  auth/domain/repository:
    interfaces:
      UserRepository:
        config:
          mockname: UserRepositoryMock
      RefreshTokenRepository:
        config:
          mockname: RefreshTokenRepositoryMock
  auth/domain/service:
    interfaces:
      ITokenService:
        config:
          mockname: TokenServiceMock
      IUserRegistrationService:
        config:
          mockname: UserRegistrationServiceMock
